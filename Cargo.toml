[workspace]
members = ["clipd", "clipui", "clip-launcher", "clip-common"]

resolver = "2"

[workspace.dependencies]
anyhow = "1.0.103"
eframe = "0.35.0"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
dotenvy = "0.15.7"

[profile.release]
debug = true
strip = false
